name: SA4E-358 CI — CORS Origin/Host gate hardening

# Per-ticket CI pipeline for SA4E-358 (Phase 4.5, prepared BEFORE Phase 5 DEV).
# Pattern: ci-sa4e-356.yml (per-ticket layout; SA4E-356 is still ACTIVE in UAT
# — its workflow is untouched and remains the PathResolver N-7/N-8 gate).
#
# Scope (TDD v1.1 §11/§12 + STP v1.1 §2.4/§2.5 + SECURITY-REVIEW v1.0):
#   - extension/: tsc -> eslint -> vitest (38-case unit suite + T1..T14
#     integration matrix + regression TC-22..31/37) -> coverage gate
#     (OriginGate.ts >= 95% lines/functions/branches/statements — STP §2.5 UT
#     exit, TDD §11.8 target, N-7-standard 4 metrics; enforced via scoped
#     coverage.include + perFile thresholds in extension/vitest.config.ts)
#     -> VSIX smoke.
#   - CORS consistency gate (REQUIRED, blocking): grep script
#     scripts/check-cors-gate-sa4e358.sh --all — SCAN-01 (0 x wildcard ACAO
#     anywhere, merge condition #6), SCAN-02 (Access-Control-* only inside
#     WrapperServer AFTER the evaluateOriginGate call), I-1 (gate precedes
#     every route dispatch), G-2 (OriginGate purity: only ./PathResolver
#     import, no http/vscode).
#   - Semgrep custom rules (.semgrep/sa4e-358-cors.yml): defense-in-depth for
#     the grep gate — informational until a green run post-C3 (same promotion
#     policy as SA4E-356 semgrep-n8).
#   - Supply-chain hygiene: npm audit --omit=dev --audit-level=high on
#     extension (ticket adds ZERO new runtime deps — TDD §1.3 — so
#     High/Critical = block).
#
# INSTALL STRATEGY — root workspaces install (NOT standalone `npm ci`):
#   Same pre-existing lock drift documented in ci-sa4e-356.yml header
#   (extension/package.json ahead of package-lock.json; owned by the lock
#   re-sync ticket). Per-ticket jobs use the repo-canonical root workspaces
#   install from ci.yml. vitest 4.1.8 + @vitest/coverage-v8 4.1.8 are pinned
#   EXACT in extension/package.json devDependencies so the coverage gate
#   stays version-aligned under float installs (vitest hard-requires
#   provider == runner version) — DEV must bump BOTH together.
#
# Omitted vs the SA4E-356 layout (with reasons):
#   - backend-drawio job: SA4E-358 touches ZERO backend files (TDD §5.2 row 9:
#     services/PathResolver.ts, remote-backend-client.ts, proxy/ToolProxy.ts
#     and the whole tool layer are "KHONG THAY DOI"; routeToolCall envelope is
#     byte-semantic unchanged, FR-10). The full backend suite already runs in
#     ci.yml on every push/PR — a per-ticket backend job would duplicate it.
#   - DB migration: N/A (TDD §4 — no database / persistent entity; the only
#     "data" is the allowlist constant + sanitized deny log line).
#   - Dockerfile / containers: N/A — the extension runs INSIDE the Kiro
#     Extension Host process (needs vscode API + loopback :9181); same as
#     SA4E-356. Local test env = Node 22 + root npm install.
#   - Environment configs: N/A — OriginGate is a hardcoded readonly constant
#     (ALLOWED_ORIGIN_PATTERNS per BR-09 / FSD §3.1.4.1; runtime/workspace
#     settings rejected as supply-chain surface); extension config ships via
#     contributes.configuration (package.json), no secrets, no .env.
#   - Monitoring/alerting: Phase 6.7 DPG scope, not Phase 4.5 (deny-spike
#     review stays manual via outputChannel — TDD §10.2/OI-4).
#
# RED-BY-DESIGN note (Phase 4.5 — code not yet implemented, TDD §12 order):
#   - The consistency-gate `--all` job is RED until DEV lands C1
#     (services/OriginGate.ts) + C3 (handleRequest rewrite): pre-fix
#     WrapperServer.ts:126-128 still sets ACAO "*"/Allow-Methods/Headers
#     unconditionally and no evaluateOriginGate() call exists. Do NOT "fix"
#     the gate — implement TDD §3.6.
#   - The semgrep job matches the same pre-fix literals -> informational
#     (continue-on-error) until 1 green run post-C3.
#   - The extension test job is GREEN at Phase 4.5 (no SA4E-358 tests exist
#     yet); the coverage gate ARMS automatically when services/OriginGate.ts
#     lands (TDD step C1) — before that it reports SKIP instead of failing on
#     an empty coverage set (mirrors the SA4E-356 N-7 pattern).
#   - V-1..V-4 evidence, live harness (incl. LH-13..15 SEC-358-01 vectors) and
#     bench p99 < 1ms are manual/on-demand on a REAL Kiro host + real MCP
#     clients (STP §2.8, TDD §11.6/§11.7) — NOT automatable in CI; they are
#     merge conditions tracked in STP §2.5, verified outside this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sa4e-358-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Extension — tsc + eslint + vitest (unit 38 + IT T1..T14 + regression)
  # + coverage gate (OriginGate.ts >= 95%, perFile)
  # Matrix ubuntu+windows: the gate is pure TypeScript + Node http rawHeaders
  # (no platform-specific code — TDD §9 NFR cross-platform), but the existing
  # extension suite carries platform-conditional behavior; run both to match
  # the SA4E-356 matrix convention.
  # ---------------------------------------------------------------------------
  extension:
    name: Extension — Typecheck / Lint / Test / Coverage gate OriginGate >= 95% (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"

      - name: Install (root workspaces — repo-canonical, see header)
        shell: bash
        run: |
          rm -rf node_modules backend/node_modules extension/node_modules
          npm cache clean --force
          npm install --force --no-audit --no-fund
          npm install --force --no-audit --no-fund --os=linux --cpu=x64 @rolldown/binding-linux-x64-gnu

      - name: Type-check extension (tsc, 0 errors)
        run: npm run compile --workspace=extension
        working-directory: .

      - name: Lint extension (eslint src/)
        # Same relaxed policy as SA4E-356: pre-existing warnings must not block
        # the ticket gate — staged-file cleanliness is enforced by the
        # pre-commit lint-staged hook instead. New SA4E-358 code (OriginGate.ts
        # + handleRequest delta) must be clean.
        run: npm run lint --workspace=extension
        working-directory: .
        continue-on-error: true

      - name: Unit + integration (vitest, no coverage)
        # Arms progressively as DEV lands C1..C5 (TDD §12): 38-case unit suite
        # (services/__tests__/origin-gate.test.ts) + T1..T14 describe block in
        # wrapper-server.test.ts + regression TC-22..TC-31/TC-37. Green at
        # Phase 4.5 (nothing to run yet).
        run: npm run test --workspace=extension
        working-directory: .

      - name: Coverage gate (OriginGate.ts >= 95% — STP §2.5 UT exit)
        # Thresholds live in vitest.config.ts (coverage.include scoped to
        # PathResolver.ts + OriginGate.ts, perFile: true — each gated module
        # individually >= 95% L/F/B/S). Arms when services/OriginGate.ts lands
        # (TDD step C1); before that it reports SKIP instead of failing on an
        # empty coverage set (mirrors the SA4E-356 N-7 arming pattern).
        shell: bash
        working-directory: extension
        run: |
          if [ -f src/services/OriginGate.ts ]; then
            npm run test:coverage
          else
            echo "SKIP coverage gate: src/services/OriginGate.ts not yet implemented (TDD step C1 pending) — gate arms on landing."
          fi

      - name: Package VSIX smoke (vsce, no dependencies)
        working-directory: extension
        run: npx @vscode/vsce package --no-dependencies
        continue-on-error: true

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: sa4e-358-extension-vsix-${{ matrix.os }}
          path: extension/*.vsix
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # CORS consistency gate (REQUIRED, blocking) — TDD §8.6 checklist + STP §2.5
  # SCAN-01/SCAN-02 + security review merge condition #6 (grep 0 `ACAO: *`).
  # Grep over extension/src/ (excl. __tests__); needs NO node_modules — runs
  # on the raw tree. RED until C1+C3 land (see RED-BY-DESIGN header).
  # ---------------------------------------------------------------------------
  cors-consistency-gate:
    name: CORS gate-first consistency gate (grep, REQUIRED)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: SCAN-01/02 — full tree
        shell: bash
        run: bash scripts/check-cors-gate-sa4e358.sh --all

  # ---------------------------------------------------------------------------
  # Semgrep custom rules — defense-in-depth for the grep gate
  # (SECURITY-REVIEW v1.0 §SCAN + SA4E-356 lesson: informational until the
  # runner + rules prove stable on a green post-fix run; the grep gate above
  # is the blocking enforcement. Pre-triaged in the rules file header —
  # echo block (gate.echoOrigin) and deny path cannot match.)
  # ---------------------------------------------------------------------------
  semgrep-cors:
    name: Semgrep CORS rules (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install semgrep
        run: pip install semgrep
        continue-on-error: true

      - name: Run SA4E-358 CORS rules
        run: semgrep --config .semgrep/sa4e-358-cors.yml --error --strict .
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Supply-chain hygiene — ticket adds ZERO new RUNTIME deps (TDD §1.3: pure
  # TypeScript + Node built-ins; the gate imports only sanitizeLogText), so a
  # High/Critical finding on runtime deps blocks. Same job pattern as ci.yml
  # and ci-sa4e-356.yml (root workspaces install).
  # ---------------------------------------------------------------------------
  supply-chain:
    name: Supply-chain hygiene (npm audit, extension runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"

      - name: Install (root workspaces — repo-canonical, see header)
        shell: bash
        run: |
          rm -rf node_modules backend/node_modules extension/node_modules
          npm cache clean --force
          npm install --force --no-audit --no-fund
          npm install --force --no-audit --no-fund --os=linux --cpu=x64 @rolldown/binding-linux-x64-gnu

      - name: Re-apply vendored-deps patch (2nd install skips root postinstall)
        # The @rolldown binding install re-resolves the tree and reverts the
        # shrinkwrapped brace-expansion@5.0.9 (pi-coding-agent) — and that
        # second `npm install <pkg>` does NOT re-run the root postinstall.
        # Re-run the patch so `npm audit` (reads package-lock.json) sees the
        # real 5.0.12 fix. Idempotent + offline.
        run: node scripts/patch-vendored-deps.mjs

      - name: npm audit — fail on High/Critical (runtime deps)
        run: npm audit --omit=dev --audit-level=high
        working-directory: extension

