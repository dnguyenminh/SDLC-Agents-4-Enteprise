name: SA4E-223 CI — Indexer Quality Gate (BR-18)

# Per-ticket CI gate for SA4E-223 (Salesforce file-extension indexer fix).
# Enforces: install -> lint -> line-count gate -> build -> unit tests -> security scan.
# Unit-test failure or any NEW file > 200 lines MUST fail the build (TC-084 / BR-18).

on:
  push:
    branches: ["SA4E-223*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: sa4e-223-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Install → Lint → Line-count → Build → Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout (full history for line-count diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Line-count gate (BR-18 / AC7) — changed files only
        # Only flags NEW/CHANGED .ts in backend/src vs master, so pre-existing
        # large files do not block the build.
        run: bash ../scripts/check-line-count.sh --changed origin/master

      - name: Build (tsc)
        run: npm run build

      - name: Unit tests (vitest --run) — FAIL build on test failure
        # `vitest run` (npm run test:unit) exits non-zero when any test fails,
        # which fails this step and blocks the merge (TC-084 / BR-18).
        run: npm run test:unit

  security-scan:
    name: Security Scan (npm audit)
    runs-on: ubuntu-latest
    needs: quality-gate
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production deps, high+)
        # Fails the pipeline on high/critical vulnerabilities in runtime deps.
        # Dev-only advisories are excluded to avoid blocking on test tooling.
        run: npm audit --omit=dev --audit-level=high
