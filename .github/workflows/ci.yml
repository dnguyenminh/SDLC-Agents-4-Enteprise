name: CI — Build & Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Clean install (root workspace + rolldown binding)
        run: |
          rm -rf node_modules backend/node_modules extension/node_modules
          npm cache clean --force
          npm install --force --no-audit --no-fund
          npm install --force --no-audit --no-fund --os=linux --cpu=x64 @rolldown/binding-linux-x64-gnu
        working-directory: .

      - run: npm run build --workspace=backend
        working-directory: .

      - run: npm run test:unit --workspace=backend
        working-directory: .
        continue-on-error: true

  extension:
    name: Extension — Compile & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Clean install (root workspace + rolldown binding)
        run: |
          rm -rf node_modules backend/node_modules extension/node_modules
          npm cache clean --force
          npm install --force --no-audit --no-fund
          npm install --force --no-audit --no-fund --os=linux --cpu=x64 @rolldown/binding-linux-x64-gnu
        working-directory: .

      - run: npm run compile --workspace=extension
        working-directory: .

      - run: npm run test --workspace=extension
        working-directory: .
        continue-on-error: true

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Clean install (root workspace + rolldown binding)
        run: |
          rm -rf node_modules backend/node_modules extension/node_modules
          npm cache clean --force
          npm install --force --no-audit --no-fund
          npm install --force --no-audit --no-fund --os=linux --cpu=x64 @rolldown/binding-linux-x64-gnu
        working-directory: .

      - run: npm run build --workspace=backend
        working-directory: .

      - run: npm run test:integration --workspace=backend
        working-directory: .
        continue-on-error: true

  e2e-api:
    name: E2E API Tests
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Clean install (root workspace + rolldown binding)
        run: |
          rm -rf node_modules backend/node_modules extension/node_modules
          npm cache clean --force
          npm install --force --no-audit --no-fund
          npm install --force --no-audit --no-fund --os=linux --cpu=x64 @rolldown/binding-linux-x64-gnu
        working-directory: .

      - run: npm run build --workspace=backend
        working-directory: .

      - name: Start code-intel MCP server
        run: |
          nohup npx tsx backend/src/index.ts > /tmp/code-intel.log 2>&1 &
          echo $! > /tmp/code-intel.pid
          sleep 10
          # Wait for health
          for i in {1..30}; do
            curl -s http://localhost:48721/health && break || sleep 2;
          done
        working-directory: .
        env:
          CODE_INTEL_PORT: 9181
          ADMIN_INITIAL_PASSWORD: test-admin-pw-01
          NODE_ENV: test

      - run: npm run test:e2e-api --workspace=backend
        working-directory: .
        continue-on-error: true
