name: CI — Build & Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci --workspace backend --include=optional

      - run: npm run build --workspace backend

      - run: npm run test:unit --workspace backend
        continue-on-error: true

  extension:
    name: Extension — Compile & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci --workspace extension --include=optional

      - run: npm run compile --workspace extension

      - run: npm run test --workspace extension
        continue-on-error: true

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci --workspace backend --include=optional

      - run: npm run build --workspace backend

      - run: npm run test:integration --workspace backend
        continue-on-error: true

  e2e-api:
    name: E2E API Tests
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci --workspace backend --include=optional

      - run: npm run build --workspace backend

      - run: npm run test:e2e-api --workspace backend
        continue-on-error: true
