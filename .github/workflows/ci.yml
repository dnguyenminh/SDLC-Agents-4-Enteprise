name: CI — Build & Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    env:
      ROLLDOWN_SKIP_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: |
          rm -rf node_modules
          npm cache clean --force
          npm install --force
        working-directory: .

      - run: npm run build
        working-directory: backend

      - run: npm run test:unit
        working-directory: backend
        continue-on-error: true

      - run: npm run build
        working-directory: backend

      - run: npm run test:unit
        working-directory: backend
        continue-on-error: true

  extension:
    name: Extension — Compile & Test
    runs-on: ubuntu-latest
    env:
      ROLLDOWN_SKIP_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: |
          rm -rf node_modules
          npm cache clean --force
          npm install --force
        working-directory: .

      - run: npm run compile
        working-directory: extension

      - run: npm run test
        working-directory: extension

      - run: npm run compile
        working-directory: extension

      - run: npm run test
        working-directory: extension
        continue-on-error: true

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend]
    env:
      ROLLDOWN_SKIP_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: |
          rm -rf node_modules
          npm cache clean --force
          npm install --force
        working-directory: .

      - run: npm run test:integration
        working-directory: backend

      - run: npm run build
        working-directory: backend

      - run: npm run test:integration
        working-directory: backend
        continue-on-error: true

  e2e-api:
    name: E2E API Tests
    runs-on: ubuntu-latest
    needs: [backend]
    env:
      ROLLDOWN_SKIP_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: |
          rm -rf node_modules
          npm cache clean --force
          npm install --force
        working-directory: .

      - run: npm run test:e2e
        working-directory: backend

      - run: npm run build
        working-directory: backend

      - run: npm run test:e2e-api
        working-directory: backend
        continue-on-error: true
