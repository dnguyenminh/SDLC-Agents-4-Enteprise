name: Auto-release Extension

on:
  workflow_run:
    workflows:
      - "Build ONNX Runtime Native (onnxruntime-node)"
    types: [completed]
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT || github.token }}
          fetch-depth: 0

      - name: Check if new binaries were uploaded
        id: check_new
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          JOBS=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name | startswith("build")) | .conclusion')

          if echo "$JOBS" | grep -q "success"; then
            echo "has_new=true" >> $GITHUB_OUTPUT
            echo "✅ New binaries were built"
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
            echo "ℹ️ All builds were skipped"
          fi

      - name: Bump version
        id: bump
        if: >
          github.event_name == 'workflow_dispatch' ||
          steps.check_new.outputs.has_new == 'true'
        run: |
          CURRENT=$(jq -r .version extension/package.json)
          echo "Current version: $CURRENT"

          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          jq ".version = \"$NEW_VERSION\"" extension/package.json > tmp.json
          mv tmp.json extension/package.json

      - name: Commit and tag
        if: steps.bump.outputs.version != ''
        env:
          # Prefer PAT; fall back to the job's GITHUB_TOKEN. Pushing via an
          # explicit tokenized remote URL is more reliable than relying on
          # checkout's persisted credentials (which silently fall back to a
          # read-only token and produce an opaque 403).
          PUSH_TOKEN: ${{ secrets.PAT || github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"

          # Fail loud if the PAT secret is empty — makes the "is the secret set?"
          # question unambiguous instead of a downstream 403.
          if [ -z "${{ secrets.PAT }}" ]; then
            echo "::warning::secrets.PAT is EMPTY — falling back to GITHUB_TOKEN (push to main may 403)."
          else
            echo "🔑 secrets.PAT is present (length check passed)."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Keep root/backend/extension in lockstep in the SAME commit before
          # tagging, so the tag points at the fully version-synced tree (avoids
          # the old amend-after-tag + force-push dance).
          jq ".version = \"${VERSION}\"" backend/package.json > tmp.json && mv tmp.json backend/package.json
          jq ".version = \"${VERSION}\"" package.json > tmp.json && mv tmp.json package.json
          git add extension/package.json backend/package.json package.json
          git commit -m "chore(release): v${VERSION} — version sync (auto-release)"
          git tag "v${VERSION}"

          # Push over HTTPS with the token embedded in the remote URL.
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main --tags
          echo "✅ Pushed v${VERSION}"

      - name: Setup Node.js for npm publish
        if: steps.bump.outputs.version != ''
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          registry-url: 'https://registry.npmjs.org'

      - name: Build and publish to npm
        if: steps.bump.outputs.version != ''
        working-directory: backend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is empty or not set."
            exit 1
          fi
          npm ci
          npm run build
          PKG_NAME=$(jq -r .name package.json)
          VERSION="${{ steps.bump.outputs.version }}"
          if npm view "${PKG_NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "⚠️ ${PKG_NAME}@${VERSION} already published — skipping."
          else
            npm publish --access public
            echo "✅ Published ${PKG_NAME}@${VERSION} to npm"
          fi

      - name: Create GitHub Release
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo '')"
          echo "✅ GitHub Release v${VERSION} created"

