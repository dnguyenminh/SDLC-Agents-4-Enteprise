name: SA4E-229 CI — jira_download_attachment Quality Gate

# Per-ticket CI gate for SA4E-229 (Jira download attachment tool — fixes 403 error).
# Enforces: install -> lint -> line-count gate -> build -> unit + integration tests -> docker build -> security scan.
# Unit/integration failure or any NEW file > 200 lines MUST fail the build (BR-18).

on:
  push:
    branches: ["SA4E-229*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: sa4e-229-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Install → Lint → Line-count → Build → Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout (full history for line-count diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Line-count gate (BR-18) — changed files only
        # Only flags NEW/CHANGED .ts in backend/src vs master, so pre-existing
        # large files do not block the build.
        run: bash ../scripts/check-line-count.sh --changed origin/master

      - name: Build (tsc)
        run: npm run build

      - name: Unit tests (vitest --run)
        run: npm run test:unit

      - name: Integration tests (download-attachment IT)
        # jira-download-attachment-tool.it.test.ts + integration-jira-download-attachment.test.ts
        run: npm run test:integration
        continue-on-error: false

  docker-build:
    name: Docker Build (production target)
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f backend/Dockerfile -t sdlc-agent-4-enterprise-server:sa4e-229 --target production backend

  security-scan:
    name: Security Scan (npm audit)
    runs-on: ubuntu-latest
    needs: quality-gate
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production deps, high+)
        # Fails the pipeline on high/critical vulnerabilities in runtime deps.
        # Dev-only advisories are excluded to avoid blocking on test tooling.
        run: npm audit --omit=dev --audit-level=high
