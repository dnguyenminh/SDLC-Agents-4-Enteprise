# =============================================================================
# SA4E-335 — Build & push backend production image (per-OS / multi-arch)
# -----------------------------------------------------------------------------
# Builds the multi-stage `production` target of backend/Dockerfile and pushes it
# to a container registry with semver + commit-SHA tags. Authenticates using CI
# secrets only (GHCR GITHUB_TOKEN by default). Fail-visible: any non-zero step
# ends the run RED and pushes nothing (BR-19).
#
# PER-OS (multi-arch) design (AD-4): instead of shipping ONE image that carries
# onnxruntime's win32+darwin+both-linux binaries (548MB of dead weight), this
# workflow builds a SEPARATE single-arch image per target platform. Each matrix
# job runs on a matching runner and builds with `--platform`, so the Dockerfile's
# native-binary trim (SA4E-335) keeps ONLY that platform's onnxruntime binaries:
#   - linux/amd64  on ubuntu-latest        -> sa4e-backend:linux-amd64  (~305MB ort)
#   - linux/arm64  on ubuntu-24.04-arm64   -> sa4e-backend:linux-arm64  (~25MB ort)
# Consumers pull the OS they run on (`docker pull sa4e-backend:linux-arm64@sha-...`)
# or use `latest` (owned by amd64, the default). Both images are mirrored to
# Docker Hub in the SAME push (one buildx invocation per arch, same digest).
#
# Registry is configuration, not code (AD-4, BR-20): set repo variables REGISTRY
# and IMAGE_NAME to target a different primary registry. In addition, the image is
# mirrored to Docker Hub (DOCKERHUB_IMAGE) when DOCKER_HUB_USERNAME /
# DOCKER_HUB_TOKEN secrets are present — a single buildx invocation pushes the
# identical image (same digest) to BOTH registries per arch (AD-3).
#
# Security:
#   - SEC-13: third-party actions pinned by commit SHA (tag in trailing comment).
#   - SEC-13: registry login + push run ONLY on non-PR events (fork PRs never see
#             push credentials); login is gated after the build graph (AD-7).
#   - SEC-04: Trivy image scan gates the push — fails on CRITICAL/HIGH CVEs.
# =============================================================================
name: SA4E-335 — Build & push backend image (per-OS)

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: sa4e-335-build-push-${{ github.ref }}-${{ matrix.platform }}
  cancel-in-progress: true

permissions:
  contents: read # read source
  packages: write # push to GHCR

env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || format('{0}/backend', github.repository) }}
  # Docker Hub mirror target. Override via repo variable DOCKERHUB_IMAGE.
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'dnguyenminh/sdlc-agents-4-enteprise-backend' }}
  BUILD_TARGET: production
  BUILD_CONTEXT: backend
  # Per-OS matrix inputs — consumed by the tag step and the build/push steps.
  PLATFORM: ${{ matrix.platform }}
  PLATFORM_TAG: ${{ matrix.platform-tag }}
  PRIMARY: ${{ matrix.primary }}

jobs:
  build-and-push:
    name: Build (${{ matrix.platform }}) & push
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 is the "primary" arch: it owns `latest` and runs on the default
          # ubuntu-latest runner (native linux/amd64, no emulation).
          - platform: linux/amd64
            platform-tag: linux-amd64
            primary: true
            runner: ubuntu-latest
          # arm64 is secondary: dedicated runner (native linux/arm64) so the build
          # is not emulated via qemu. The Dockerfile native trim keeps only
          # linux/arm64 onnxruntime binaries, so this image is tiny.
          - platform: linux/arm64
            platform-tag: linux-arm64
            primary: false
            runner: ubuntu-24.04-arm64

    steps:
      # 1. Checkout — full history so semver tags resolve (metadata-action).
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      # GHCR/OCI refs must be lowercase; vars.IMAGE_NAME and github.repository
      # fallback are mixed-case (repo name has uppercase). Normalize once.
      - name: Normalize image name to lowercase
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      # 2. Derive tags/labels. Each arch gets its own tag set under PLATFORM_TAG
      #    (e.g. sha-xxx, v1.2.3, major.minor); `latest` is owned ONLY by the
      #    primary arch (amd64) and never on PRs.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PLATFORM_TAG }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}:${{ env.PLATFORM_TAG }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.PRIMARY == 'true' }}

      # 3. Setup Buildx (build cache + buildx --platform).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      # 4. Registry login — PUSH EVENTS ONLY (SEC-13). A broken build (steps 1-3)
      #    never reaches this step, so credentials are only read for a buildable
      #    source (AD-7). GITHUB_TOKEN works for GHCR with no stored secret.
      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4b. Docker Hub login — PUSH EVENTS ONLY (SEC-13). Mirrors each arch to
      #     Docker Hub alongside GHCR. Uses DOCKER_HUB_USERNAME / DOCKER_HUB_TOKEN
      #     secrets (configured at repo level).
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 5. Build (no push) so the image can be scanned before distribution (AD-9).
      #    `--platform` forces the exact arch so the Dockerfile native trim keeps
      #    only THIS platform's onnxruntime binaries. The local image is tagged
      #    under $REGISTRY/$IMAGE_NAME:$PLATFORM_TAG for the Trivy step.
      - name: Build (no push)
        id: build
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/Dockerfile
          target: ${{ env.BUILD_TARGET }}
          platform: ${{ env.PLATFORM }}
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PLATFORM_TAG }}@sha-${{ hashFiles('**/package-lock.json') }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. SEC-04 — Trivy vulnerability scan on the built image BEFORE push (AD-9).
      #    Runs on PRs too: reads the locally-loaded image (no registry pull).
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PLATFORM_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      # 6b. Push the scanned image to BOTH registries (only on non-PR events).
      #     One buildx invocation per arch pushes the SAME digest to GHCR and Docker Hub.
      - name: Push image to registries
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/Dockerfile
          target: ${{ env.BUILD_TARGET }}
          platform: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. Verify the push produced an immutable digest for THIS platform.
      - name: Verify image digest & emit ref
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "::error::missing image digest — push incomplete (EF-3)"
            exit 1
          fi
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PLATFORM_TAG }}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
