# SA4E-44 Docker Compose Override — Test Environment
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up
#
# DATA-SAFETY (SA4E-335 incident): this stack MUST run under its own compose
# project so `down -v` can never reach the production volumes
# (`backend_postgres_data`, `backend_code_intel_data`). The helpers
# `scripts/test-up.ps1` / `scripts/test-down.ps1` always pass `-p sa4e-test`;
# the top-level `name:` below is a second layer of isolation for callers that
# forget the flag. Verify with:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml config
#
# NOTE: `tmpfs` was removed here — it mounted the SAME target as the named
# volume (`/var/lib/postgresql/data`), which makes Compose reject the file
# ("target already mounted"). Tests get persistence from `postgres_test_data`
# instead; teardown stays reproducible via `down -v` on project `sa4e-test`.
name: sa4e-test

services:
  postgres:
    container_name: sa4e-postgres-test
    environment:
      POSTGRES_DB: sa4e_db_test
      POSTGRES_USER: sa4e_user
      POSTGRES_PASSWORD: sa4e_test_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  backend:
    container_name: sa4e-backend-test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://sa4e_user:sa4e_test_password@postgres:5432/sa4e_db_test
      TASK_WORKER_ENABLED: "true"
      TASK_WORKER_POLL_INTERVAL_MS: "1000"
      TASK_WORKER_MAX_RETRIES: "2"
      TASK_WORKER_BACKOFF_BASE_MS: "100"
      CODE_INTEL_ENABLED: "true"
      CODE_INTEL_MAX_BATCH_SIZE: "100"
    ports:
      - "48722:48721"
    volumes: []

  # Vitest unit-test runner (target: test) — runs the full unit suite in-container.
  # Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm vitest
  vitest:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: sa4e-vitest
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://sa4e_user:sa4e_test_password@postgres:5432/sa4e_db_test
      TASK_WORKER_ENABLED: "true"
      TASK_WORKER_POLL_INTERVAL_MS: "1000"
      TASK_WORKER_MAX_RETRIES: "2"
      TASK_WORKER_BACKOFF_BASE_MS: "100"
      CODE_INTEL_ENABLED: "true"
      CODE_INTEL_MAX_BATCH_SIZE: "100"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sa4e-network
    command: ["npx", "vitest", "run"]

volumes:
  postgres_test_data:
