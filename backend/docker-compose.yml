# docker-compose.yml for SA4E-387

version: '3.8'

services:
  sdlc-agent-4-enterprise:
    build: .
    container_name: sdlc-agent-4-enterprise-sa4e-387
    ports:
      - "48721:48721"
    environment:
      - NODE_ENV=production
      - LLM_CONTEXT_WINDOW=24000
    volumes:
      - ./dist:/usr/src/app/dist
      - ./node_modules:/usr/src/app/node_modules
    restart: unless-stopped

  # Database service
  postgres:
    image: postgres:15-alpine
    container_name: postgres-sa4e-387
    environment:
      - POSTGRES_USER=sdlc
      - POSTGRES_PASSWORD=sdlc
      - POSTGRES_DB=sdlc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: